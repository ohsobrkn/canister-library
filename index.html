<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="暗盒图片库 — 胶片暗盒参考图集，按厂商、胶片类型、ISO 筛选浏览。海带索引图 FILM 附属项目。" />
  <meta name="author" content="ohsobrkn" />
  <title>暗盒图片库 · 海带索引图 FILM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171310'/%3E%3Crect x='6' y='6' width='20' height='20' rx='2' fill='%23100d0a'/%3E%3Ccircle cx='16' cy='14' r='5' fill='%23e0a458'/%3E%3Crect x='8' y='22' width='16' height='1.6' fill='%23e0a458' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // 主题引导：首帧前确定暗/亮（默认跟随系统；手动选择 light/dark 时持久化覆盖）
    (function () {
      try {
        var m = localStorage.getItem("canister-theme");
        if (m === "light" || m === "dark") document.documentElement.dataset.theme = m;
      } catch (e) {}
    })();
  </script>
</head>
<body>

<header class="lib-header">
  <div class="lib-header-inner">
    <div class="lib-header-top">
      <div>
        <a class="lib-back" href="https://ohsobrkn.github.io/film-index-generator/" data-i18n="back">← 返回海带索引图 FILM</a>
        <h1 data-i18n="title">暗盒图片库</h1>
        <p class="lib-sub" data-i18n="sub">胶片暗盒参考图集</p>
      </div>
      <div class="lib-header-actions">
        <button id="langBtn" class="lang-btn ghost" type="button" aria-label="切换语言 / Switch language">EN</button>
        <button id="themeBtn" class="lib-icon-btn ghost" type="button" aria-label="主题模式">
          <svg class="ti-auto show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
          <svg class="ti-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ti-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <details class="lib-stats" id="statsPanel">
    <summary>
      <span class="stats-dot" aria-hidden="true"></span>
      <span data-i18n="statsTitle">库内统计</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div class="stats-body" id="statsBody">
      <div class="stats-cols">
        <div class="stats-col" id="statsManufacturer"><h4 data-i18n="statsMfr">厂商分布</h4></div>
        <div class="stats-col" id="statsFilmType"><h4 data-i18n="statsType">胶片类型分布</h4></div>
        <div class="stats-col" id="statsIso"><h4 data-i18n="statsIso">ISO 分布</h4></div>
      </div>
      <div class="stats-recent">
        <h4 data-i18n="statsRecent">最近添加</h4>
        <div class="recent-strip" id="statsRecent"></div>
      </div>
    </div>
  </details>

  <section id="filters" class="lib-filters" aria-label="筛选器"></section>

  <div class="lib-toolbar">
    <span class="lib-count" id="count"></span>
    <input type="text" class="search-input" id="search" data-i18n-ph="searchPh" placeholder="搜索型号 / 厂商 / 备注…（空格分隔多个关键词）" />
    <select id="sortKey" class="sort-select" aria-label="排序方式">
      <option value="name" data-i18n="sortName">按名称</option>
      <option value="manufacturer" data-i18n="sortMfr">按厂商</option>
    </select>
    <button id="sortDir" class="ghost" type="button" aria-label="切换排序方向">↑ 升序</button>
    <button id="resetBtn" class="ghost" type="button" data-i18n="reset">重置筛选</button>
  </div>

  <section id="grid" class="lib-grid" aria-label="图片列表"></section>
  <div id="empty" class="lib-empty" hidden data-i18n="empty">没有符合条件的暗盒图片，试试调整筛选条件。</div>
</main>

<footer class="lib-footer">
  <span data-i18n="footerTotal">共收录</span> <b id="totalCount">0</b> <span data-i18n="footerUnit">张暗盒参考图</span> · <span data-i18n="footerBy">由</span> <a href="https://github.com/ohsobrkn" target="_blank" rel="noopener">ohsobrkn</a> <span data-i18n="footerMaintain">维护</span>
  · <span data-i18n="footerHost">纯静态托管于 GitHub Pages</span> · <a href="admin.html" data-i18n="footerAdmin">管理入口</a>
</footer>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片大图">
  <span class="lb-counter" id="lbCounter"></span>
  <button class="lb-close ghost" id="lbClose" type="button">关闭 Esc</button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="上一张">‹</button>
  <div class="lightbox-stage">
    <div class="lightbox-img-wrap"><img class="lightbox-img" id="lbImg" alt="" /></div>
    <aside class="lightbox-meta" id="lbMeta"></aside>
  </div>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="下一张">›</button>
</div>

<script>
(function () {
  "use strict";

  /* ===== i18n ===== */
  var I18N = {
    back: { zh: "← 返回海带索引图 FILM", en: "← Back to FILM Index" },
    title: { zh: "暗盒图片库", en: "Canister Library" },
    sub: { zh: "胶片暗盒参考图集", en: "Film Canister Reference Library" },
    searchPh: { zh: "搜索型号 / 厂商 / 备注…（空格分隔多个关键词）", en: "Search model / maker / notes… (space-separated keywords)" },
    sortName: { zh: "按名称", en: "By name" },
    sortMfr: { zh: "按厂商", en: "By maker" },
    asc: { zh: "↑ 升序", en: "↑ Asc" },
    desc: { zh: "↓ 降序", en: "↓ Desc" },
    reset: { zh: "重置筛选", en: "Reset" },
    statsTitle: { zh: "库内统计", en: "Library Stats" },
    statsMfr: { zh: "厂商分布", en: "By Maker" },
    statsType: { zh: "胶片类型分布", en: "By Film Type" },
    statsIso: { zh: "ISO 分布", en: "By ISO" },
    statsRecent: { zh: "最近添加", en: "Recently Added" },
    empty: { zh: "没有符合条件的暗盒图片，试试调整筛选条件。", en: "No canisters match the current filters. Try adjusting them." },
    closeEsc: { zh: "关闭 Esc", en: "Close Esc" },
    updated: { zh: "更新于", en: "Updated" },
    thumbAlt: { zh: "缩略图", en: "thumbnail" },
    footerTotal: { zh: "共收录", en: "Total of" },
    footerUnit: { zh: "张暗盒参考图", en: "canister reference photos" },
    footerBy: { zh: "由", en: "Maintained by" },
    footerMaintain: { zh: "维护", en: "" },
    footerHost: { zh: "纯静态托管于 GitHub Pages", en: "Statically hosted on GitHub Pages" },
    footerAdmin: { zh: "管理入口", en: "Admin" },
    loadFail: { zh: "数据加载失败：", en: "Failed to load data: " },
    retryHint: { zh: "（请稍后刷新重试）", en: " (please refresh and retry later)" },
    tagsMode: { zh: "同时满足", en: "ALL selected" },
    themeAuto: { zh: "主题：跟随系统", en: "Theme: follow system" },
    themeLight: { zh: "主题：浅色", en: "Theme: light" },
    themeDark: { zh: "主题：暗色", en: "Theme: dark" },
    langLabel: { zh: "切换到英文", en: "切换到中文" }
  };
  var LANG_KEY = "canister-lang";
  var lang = "zh";
  try { lang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh"; } catch (e) {}

  function t(key) {
    var entry = I18N[key];
    return entry ? entry[lang] : key;
  }
  function applyI18n() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = t(el.getAttribute("data-i18n"));
      if (v !== "") el.textContent = v;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
      el.placeholder = t(el.getAttribute("data-i18n-ph"));
    });
    sortDirBtn.textContent = sortDir === "asc" ? t("asc") : t("desc");
    document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
    document.getElementById("langBtn").setAttribute("aria-label", t("langLabel"));
  }

  /* ===== 主题三态（跟随系统 / 浅色 / 暗色）===== */
  var THEME_KEY = "canister-theme";
  var themeMode = "auto";
  try { themeMode = localStorage.getItem(THEME_KEY) || "auto"; } catch (e) {}
  if (themeMode !== "light" && themeMode !== "dark") themeMode = "auto";

  var themeBtn = document.getElementById("themeBtn");
  function applyThemeMode(mode) {
    themeMode = mode;
    if (mode === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = mode;
    ["auto", "light", "dark"].forEach(function (m) {
      var svg = themeBtn.querySelector(".ti-" + m);
      if (svg) svg.classList.toggle("show", m === mode);
    });
    themeBtn.setAttribute("aria-label", t("theme" + mode.charAt(0).toUpperCase() + mode.slice(1)));
    themeBtn.title = themeBtn.getAttribute("aria-label");
  }
  themeBtn.addEventListener("click", function () {
    var next = themeMode === "auto" ? "light" : (themeMode === "light" ? "dark" : "auto");
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyThemeMode(next);
  });

  var langBtn = document.getElementById("langBtn");
  langBtn.addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyI18n();
    buildFilterUi();
    applyFilters();
    if (db) renderStats();
  });

  var DIM_TYPE_LABEL = {};

  var db = null;          // canisters.json 全量
  var visibleItems = [];  // 当前筛选结果
  var filters = {};       // { dimKey: Set(values) }
  var query = "";
  var lbIndex = -1;

  var filtersEl = document.getElementById("filters");
  var gridEl = document.getElementById("grid");
  var emptyEl = document.getElementById("empty");
  var countEl = document.getElementById("count");
  var totalEl = document.getElementById("totalCount");
  var searchEl = document.getElementById("search");
  var resetBtn = document.getElementById("resetBtn");

  function itemVisible(item) { return !item.status || item.status === "visible"; }

  function attrValue(item, key) {
    return item.attrs ? item.attrs[key] : undefined;
  }

  function dimOf(key) {
    for (var i = 0; i < db.dimensions.length; i += 1) {
      if (db.dimensions[i].key === key) return db.dimensions[i];
    }
    return null;
  }

  function dimValues(dim) {
    if (dim.type === "dict") return ((db.dicts && db.dicts[dim.dict]) || []).slice().sort(unifiedCompare);
    if (dim.type === "enum") return dim.values || [];
    if (dim.type === "number") {
      // ISO 档位从已录入数据动态收集：去重 + 数值升序，无需手动维护固定列表
      var seen = {};
      var vals = [];
      db.items.forEach(function (it) {
        var v = it.attrs && it.attrs[dim.key];
        if (v !== undefined && v !== null && v !== "" && !seen[v]) {
          seen[v] = Number(v);
          vals.push(String(v));
        }
      });
      return vals.sort(function (a, b) { return seen[a] - seen[b]; });
    }
    if (dim.type === "tags") {
      var set = {};
      db.items.forEach(function (it) {
        (it.tags || []).forEach(function (t) { set[t] = true; });
      });
      return Object.keys(set).sort();
    }
    return [];
  }

  function matchFilter(item) {
    for (var key in filters) {
      var active = filters[key];
      if (!active || active.size === 0) continue;
      if (key === "tags") {
        // AND 语义：所选标签须全部出现在条目标签中
        var ok = true;
        active.forEach(function (tag) {
          if ((item.tags || []).indexOf(tag) < 0) ok = false;
        });
        if (!ok) return false;
      } else {
        var v = attrValue(item, key);
        if (v === undefined || v === null || !active.has(String(v))) return false;
      }
    }
    if (query) {
      // 模糊搜索（与主站选择器一致）：空格分词，每个关键词都命中才算匹配
      var hay = (item.name || "") + " " + (item.notes || "");
      for (var k in (item.attrs || {})) hay += " " + item.attrs[k];
      (item.tags || []).forEach(function (t) { hay += " " + t; });
      hay = hay.toLowerCase();
      var tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
      for (var ti = 0; ti < tokens.length; ti += 1) {
        if (hay.indexOf(tokens[ti]) < 0) return false;
      }
    }
    return true;
  }

  /* ===== 排序（按名称 / 按厂商 × 升序 / 降序） ===== */
  var sortKey = "name";
  var sortDir = "asc";   // asc | desc
  var sortKeyEl = document.getElementById("sortKey");
  var sortDirBtn = document.getElementById("sortDir");

  /* ===== 统一排序规则（特殊符号 → 数字 → 英文字母 → 中文拼音） =====
     分类序：1 符号（!、#、@ 等非字母数字非中文）→ 2 数字（0-9）→ 3 字母（A-Z，
     不区分大小写比较，同字母时大写在前）→ 4 中文（连续中文段整段按拼音 localeCompare zh） */
  function charClass(ch) {
    var code = ch.charCodeAt(0);
    if (code >= 48 && code <= 57) return 2;
    if ((code >= 65 && code <= 90) || (code >= 97 && code <= 122)) return 3;
    if (code >= 0x2e80) return 4;
    return 1;
  }
  function chineseRun(s, i) {
    var j = i;
    while (j < s.length && s.charCodeAt(j) >= 0x2e80) j += 1;
    return s.slice(i, j);
  }
  function unifiedCompare(a, b) {
    var sa = String(a == null ? "" : a);
    var sb = String(b == null ? "" : b);
    var i = 0, j = 0;
    while (i < sa.length && j < sb.length) {
      var ca = sa.charAt(i), cb = sb.charAt(j);
      var ka = charClass(ca), kb = charClass(cb);
      if (ka !== kb) return ka - kb;
      if (ka === 4) {
        var xa = chineseRun(sa, i), xb = chineseRun(sb, j);
        var ccmp = xa.localeCompare(xb, "zh-Hans-CN");
        if (ccmp !== 0) return ccmp;
        i += xa.length; j += xb.length;
      } else {
        if (ka === 3) {
          var la = ca.toLowerCase(), lb = cb.toLowerCase();
          if (la !== lb) return la < lb ? -1 : 1;
        }
        if (ca !== cb) return ca < cb ? -1 : 1;
        i += 1; j += 1;
      }
    }
    if (i >= sa.length && j >= sb.length) return 0;
    return i >= sa.length ? -1 : 1;
  }

  function sortItems(arr) {
    return arr.slice().sort(function (a, b) {
      var va, vb;
      if (sortKey === "manufacturer") {
        va = attrValue(a, "manufacturer") != null ? String(attrValue(a, "manufacturer")) : "";
        vb = attrValue(b, "manufacturer") != null ? String(attrValue(b, "manufacturer")) : "";
      } else {
        va = (a.name || a.id || "").toString();
        vb = (b.name || b.id || "").toString();
      }
      var cmp = unifiedCompare(va, vb);
      return sortDir === "asc" ? cmp : -cmp;
    });
  }

  function applyFilters() {
    visibleItems = sortItems(db.items.filter(function (it) { return itemVisible(it) && matchFilter(it); }));
    renderGrid();
    syncUrl();
    countEl.innerHTML = lang === "zh"
      ? "共 <b>" + db.items.filter(itemVisible).length + "</b> 张 · 当前显示 <b>" + visibleItems.length + "</b> 张"
      : "<b>" + visibleItems.length + "</b> of <b>" + db.items.filter(itemVisible).length + "</b> canisters";
  }

  function syncUrl() {
    var params = new URLSearchParams();
    for (var key in filters) {
      if (filters[key] && filters[key].size) params.set(key, Array.from(filters[key]).join(","));
    }
    if (query) params.set("q", query);
    if (sortKey !== "name") params.set("sort", sortKey);
    if (sortDir !== "asc") params.set("dir", sortDir);
    var qs = params.toString();
    window.history.replaceState(null, "", qs ? "?" + qs : window.location.pathname);
  }

  function readUrl() {
    var params = new URLSearchParams(window.location.search);
    filters = {};
    db.dimensions.forEach(function (dim) {
      var raw = params.get(dim.key);
      if (raw) filters[dim.key] = new Set(raw.split(",").filter(Boolean));
      else filters[dim.key] = new Set();
    });
    filters.tags = filters.tags || new Set();
    query = params.get("q") || "";
    searchEl.value = query;
    var sk = params.get("sort");
    sortKey = (sk === "manufacturer" || sk === "name") ? sk : "name";
    sortDir = params.get("dir") === "desc" ? "desc" : "asc";
    sortKeyEl.value = sortKey;
    sortDirBtn.textContent = sortDir === "asc" ? t("asc") : t("desc");
  }

  function buildFilterUi() {
    filtersEl.innerHTML = "";
    db.dimensions.forEach(function (dim) {
      DIM_TYPE_LABEL[dim.key] = dim.label;
      var group = document.createElement("div");
      group.className = "filter-group";
      var label = document.createElement("span");
      label.className = "filter-label";
      label.textContent = dim.label;
      group.appendChild(label);
      // 标签维度提示 AND 语义（所选标签须全部满足）
      if (dim.type === "tags") {
        var badge = document.createElement("span");
        badge.className = "tags-mode-badge";
        badge.textContent = t("tagsMode");
        group.appendChild(badge);
      }
      dimValues(dim).forEach(function (val) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = dim.type === "number" ? "ISO " + val : val;
        var set = filters[dim.key] || (filters[dim.key] = new Set());
        if (set.has(String(val))) btn.classList.add("on");
        btn.addEventListener("click", function () {
          var v = String(val);
          if (set.has(v)) { set.delete(v); btn.classList.remove("on"); }
          else { set.add(v); btn.classList.add("on"); }
          applyFilters();
        });
        group.appendChild(btn);
      });
      filtersEl.appendChild(group);
    });
  }

  function renderGrid() {
    gridEl.innerHTML = "";
    visibleItems.forEach(function (item) {
      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "button");
      card.tabIndex = 0;

      var img = document.createElement("img");
      img.className = "card-thumb";
      img.loading = "lazy";
      // 统一缩略图规格 300×420：加载前即预留精确空间，网格零抖动
      img.width = 300; img.height = 420;
      img.src = item.thumb;
      img.alt = (item.name || item.id) + " " + t("thumbAlt");
      card.appendChild(img);

      var body = document.createElement("div");
      body.className = "card-body";
      var name = document.createElement("div");
      name.className = "card-name";
      name.textContent = item.name || item.id;
      body.appendChild(name);

      var meta = document.createElement("div");
      meta.className = "card-meta";
      var parts = [];
      ["manufacturer", "filmType"].forEach(function (k) {
        var v = attrValue(item, k);
        if (v !== undefined && v !== null && v !== "") parts.push(String(v));
      });
      if (attrValue(item, "iso") !== undefined && attrValue(item, "iso") !== null) parts.push("ISO " + attrValue(item, "iso"));
      meta.textContent = parts.join(" · ");
      body.appendChild(meta);

      if (item.tags && item.tags.length) {
        var tags = document.createElement("div");
        tags.className = "card-tags";
        item.tags.forEach(function (t) {
          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = t;
          tags.appendChild(tag);
        });
        body.appendChild(tags);
      }
      card.appendChild(body);

      var open = function () { openLightbox(item); };
      card.addEventListener("click", open);
      card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      gridEl.appendChild(card);
    });
    emptyEl.hidden = visibleItems.length > 0;
  }

  function openLightbox(item) {
    lbIndex = visibleItems.indexOf(item);
    renderLightbox();
    var lb = document.getElementById("lightbox");
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("lbClose").focus();
  }

  function renderLightbox() {
    if (lbIndex < 0 || lbIndex >= visibleItems.length) return;
    var item = visibleItems[lbIndex];
    var img = document.getElementById("lbImg");
    img.src = item.original;
    img.alt = item.name || item.id;

    var meta = document.getElementById("lbMeta");
    meta.innerHTML = "";
    var h = document.createElement("h3");
    h.textContent = item.name || item.id;
    meta.appendChild(h);
    var sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = item.id + " · " + t("updated") + " " + String(item.updatedAt || "").slice(0, 10);
    meta.appendChild(sub);

    db.dimensions.forEach(function (dim) {
      if (dim.type === "tags") {
        if (item.tags && item.tags.length) {
          var rowT = metaRow(dim.label, item.tags.join(" · "));
          meta.appendChild(rowT);
        }
        return;
      }
      var v = attrValue(item, dim.key);
      if (v === undefined || v === null || v === "") return;
      var row = metaRow(dim.label, dim.key === "iso" ? "ISO " + v : String(v));
      meta.appendChild(row);
    });

    if (item.notes) {
      var notes = document.createElement("div");
      notes.className = "lightbox-notes";
      notes.textContent = item.notes;
      meta.appendChild(notes);
    }

    document.getElementById("lbCounter").textContent = (lbIndex + 1) + " / " + visibleItems.length;
  }

  function metaRow(k, v) {
    var row = document.createElement("div");
    row.className = "meta-row";
    var ke = document.createElement("span");
    ke.className = "k";
    ke.textContent = k;
    var ve = document.createElement("span");
    ve.className = "v";
    ve.textContent = v;
    row.appendChild(ke);
    row.appendChild(ve);
    return row;
  }

  function closeLightbox() {
    document.getElementById("lightbox").hidden = true;
    document.getElementById("lbImg").src = "";
    document.body.style.overflow = "";
  }

  function stepLightbox(delta) {
    if (lbIndex < 0) return;
    lbIndex = (lbIndex + delta + visibleItems.length) % visibleItems.length;
    renderLightbox();
  }

  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbPrev").addEventListener("click", function () { stepLightbox(-1); });
  document.getElementById("lbNext").addEventListener("click", function () { stepLightbox(1); });
  document.getElementById("lightbox").addEventListener("click", function (e) {
    if (e.target === this) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("lightbox").hidden) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowLeft") stepLightbox(-1);
    else if (e.key === "ArrowRight") stepLightbox(1);
  });

  var debounceTimer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      query = searchEl.value.trim();
      applyFilters();
    }, 160);
  });

  resetBtn.addEventListener("click", function () {
    searchEl.value = "";
    query = "";
    window.history.replaceState(null, "", window.location.pathname);
    readUrl();
    buildFilterUi();
    applyFilters();
  });

  sortKeyEl.addEventListener("change", function () {
    sortKey = this.value;
    applyFilters();
  });

  sortDirBtn.addEventListener("click", function () {
    sortDir = sortDir === "asc" ? "desc" : "asc";
    this.textContent = sortDir === "asc" ? t("asc") : t("desc");
    applyFilters();
  });

  /* ===== 库内统计：维度分布条形图（可点击设筛选）+ 最近添加 ===== */
  function renderStats() {
    if (!db) return;
    var groups = [
      { key: "manufacturer", host: "statsManufacturer", labelOf: function (v) { return v; } },
      { key: "filmType", host: "statsFilmType", labelOf: function (v) { return v; } },
      { key: "iso", host: "statsIso", labelOf: function (v) { return "ISO " + v; } }
    ];
    groups.forEach(function (g) {
      var host = document.getElementById(g.host);
      // 清掉上轮行（保留 h4）
      Array.prototype.slice.call(host.querySelectorAll(".stat-row")).forEach(function (r) { r.remove(); });
      var counts = {};
      var order = [];
      db.items.forEach(function (it) {
        var v = attrValue(it, g.key);
        if (v === undefined || v === null || v === "") return;
        var k = String(v);
        if (!counts[k]) { counts[k] = 0; order.push(k); }
        counts[k] += 1;
      });
      order.sort(function (a, b) {
        if (g.key === "iso") return Number(a) - Number(b);
        return unifiedCompare(a, b);
      });
      var max = 1;
      order.forEach(function (k) { if (counts[k] > max) max = counts[k]; });
      order.forEach(function (k) {
        var row = document.createElement("div");
        row.className = "stat-row";
        row.setAttribute("role", "button");
        row.tabIndex = 0;
        var label = document.createElement("span");
        label.className = "sr-label";
        label.textContent = g.labelOf(k);
        label.title = g.labelOf(k);
        row.appendChild(label);
        var track = document.createElement("span");
        track.className = "sr-track";
        var bar = document.createElement("span");
        bar.className = "sr-bar";
        bar.style.width = "0%";
        track.appendChild(bar);
        row.appendChild(track);
        var n = document.createElement("span");
        n.className = "sr-n";
        n.textContent = counts[k];
        row.appendChild(n);
        var applySingle = function () {
          db.dimensions.forEach(function (d) {
            if (filters[d.key]) filters[d.key] = new Set();
          });
          filters[g.key] = new Set([k]);
          filters.tags = new Set();
          buildFilterUi();
          applyFilters();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        row.addEventListener("click", applySingle);
        row.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applySingle(); } });
        host.appendChild(row);
        // 生长动画：先挂 0 宽，下一帧设目标宽
        var target = Math.round(counts[k] / max * 100);
        requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = target + "%"; }); });
      });
    });

    var recentHost = document.getElementById("statsRecent");
    recentHost.innerHTML = "";
    var recent = db.items.filter(itemVisible).slice().sort(function (a, b) {
      var ta = a.createdAt || a.updatedAt || "";
      var tb = b.createdAt || b.updatedAt || "";
      return tb < ta ? -1 : (tb > ta ? 1 : 0);
    }).slice(0, 6);
    recent.forEach(function (item) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "recent-item";
      var img = document.createElement("img");
      img.loading = "lazy";
      img.src = item.thumb;
      img.alt = item.name || item.id;
      img.width = 300; img.height = 420;
      btn.appendChild(img);
      var name = document.createElement("span");
      name.className = "ri-name";
      name.textContent = item.name || item.id;
      btn.appendChild(name);
      btn.addEventListener("click", function () {
        // 跳到该图上下文：清空筛选后打开大图
        db.dimensions.forEach(function (d) { if (filters[d.key]) filters[d.key] = new Set(); });
        filters.tags = new Set();
        query = "";
        searchEl.value = "";
        buildFilterUi();
        applyFilters();
        openLightbox(item);
      });
      recentHost.appendChild(btn);
    });
  }

  // 初始化主题与语言（DOM 与全部变量就绪后）
  applyThemeMode(themeMode);
  applyI18n();

  // no-store + 时间戳穿透缓存：数据更新并重新部署后，刷新页面即可看到最新内容
  fetch("data/canisters.json?v=" + Date.now(), { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (json) {
    db = json;
    totalEl.textContent = db.items.filter(itemVisible).length;
    readUrl();
    buildFilterUi();
    applyFilters();
    renderStats();
  }).catch(function (err) {
    gridEl.innerHTML = "";
    emptyEl.hidden = false;
    emptyEl.textContent = t("loadFail") + err.message + t("retryHint");
  });
})();
</script>
</body>
</html>
